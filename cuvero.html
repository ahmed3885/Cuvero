        <a href="index.html" class="nav-btn active" data-key="home"><i class="fas fa-home"></i> Home</a>
        <a href="#" class="nav-btn" data-key="allProducts"><i class="fas fa-shopping-bag"></i> All Products</a>
        <a href="#" class="nav-btn" data-key="phoneCases"><i class="fas fa-mobile-alt"></i> Phone Cases</a>
        <a href="#" class="nav-btn" data-key="wallets"><i class="fas fa-wallet"></i> Wallets</a>

      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count">0</span>
    </div>
  </div>
</header>


<div class="custom-slider-container">
  <button class="custom-prev">‹</button>
  <div class="custom-slider-wrapper"></div>
  <button class="custom-next">›</button>
</div>



<!-- Main -->
<main>
  <div class="container">
    <div class="category-header">
      <h2 id="category-title">All Products</h2>
      <button id="back-btn" class="back-btn" style="display:none;">Back to Home</button>
    </div>
    <section class="products-section">
      <div class="products-grid" id="products-grid"></div>
    </section>
  </div>
</main>

<!-- Cart Sidebar -->
<div class="cart-sidebar" id="cart-sidebar">
  <div class="cart-header">
    <h3 data-key="cart"><i class="fas fa-shopping-cart"></i> Shopping Cart</h3>
    <button class="close-cart"><i class="fas fa-times"></i></button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total"><strong><span data-key="total">Total: </span><span id="cart-total">0</span> EGP</strong></div>
    <button class="checkout-btn" data-key="checkout">Checkout</button>
  </div>
</div>
<div class="cart-overlay" id="cart-overlay"></div>

<!-- Footer -->
<footer class="footer">
